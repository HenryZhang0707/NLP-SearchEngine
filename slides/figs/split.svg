<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="400" viewBox="0 0 1360 400">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8aa0"/>
    </marker>
  </defs>

  <!-- 离线组 -->
  <rect x="16" y="20" width="310" height="350" rx="16" fill="#f3f7fd" stroke="#c7d8f7" stroke-width="1.5"/>
  <text x="40" y="54" font-family="MiSans, Noto Sans CJK SC" font-size="20" font-weight="bold" fill="#2563eb">离线组 · 2 人</text>
  <text x="40" y="80" font-family="MiSans, Noto Sans CJK SC" font-size="15" fill="#64748b">语料 → BM25 索引 + 向量数据库</text>
  <rect x="43" y="100" width="262" height="250" rx="12" fill="#23373b" opacity="0.06"/>
  <rect x="40" y="96" width="262" height="250" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <g font-family="MiSans, Noto Sans CJK SC" font-size="18" fill="#1f2937">
    <text x="62" y="144">· 语料加载 / 共享 doc_id</text>
    <text x="62" y="186">· 倒排索引 / BM25 统计</text>
    <text x="62" y="228">· 文档向量批量编码</text>
    <text x="62" y="270">· 向量数据库 / 快照构建</text>
    <text x="62" y="312">· 版本 / 校验 / 自检查</text>
  </g>

  <!-- 接口 A -->
  <line x1="326" y1="215" x2="352" y2="215" stroke="#7a8aa0" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="359" y="159" width="180" height="130" rx="12" fill="#23373b" opacity="0.06"/>
  <rect x="356" y="155" width="180" height="130" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="2"/>
  <g font-family="MiSans, Noto Sans CJK SC" text-anchor="middle">
    <text x="446" y="199" font-size="20" font-weight="bold" fill="#1f2937">接口 A</text>
    <text x="446" y="229" font-size="18" fill="#334155">双索引产物</text>
    <text x="446" y="256" font-size="15" fill="#64748b">带版本与校验</text>
  </g>

  <!-- 在线组 -->
  <line x1="536" y1="215" x2="562" y2="215" stroke="#7a8aa0" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="566" y="20" width="380" height="350" rx="16" fill="#f0faf9" stroke="#bfe6e0" stroke-width="1.5"/>
  <text x="590" y="54" font-family="MiSans, Noto Sans CJK SC" font-size="20" font-weight="bold" fill="#0d9488">在线组 · 2 人</text>
  <text x="590" y="80" font-family="MiSans, Noto Sans CJK SC" font-size="15" fill="#64748b">索引 + 查询 → 排序结果</text>
  <rect x="593" y="100" width="332" height="250" rx="12" fill="#23373b" opacity="0.06"/>
  <rect x="590" y="96" width="332" height="250" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <g font-family="MiSans, Noto Sans CJK SC" font-size="18" fill="#1f2937">
    <text x="618" y="144">· 查询解析 / 约束保护 / SLM 扩写</text>
    <text x="618" y="186">· BM25 打分 / 查询向量编码</text>
    <text x="618" y="228">· Router / 向量库只读召回</text>
    <text x="618" y="270">· RRF 融合 / Top-K</text>
    <text x="618" y="312">· 高亮 / HTTP / 耗时回显</text>
  </g>

  <!-- 接口 B -->
  <line x1="946" y1="215" x2="972" y2="215" stroke="#7a8aa0" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="979" y="159" width="150" height="130" rx="12" fill="#23373b" opacity="0.06"/>
  <rect x="976" y="155" width="150" height="130" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="2"/>
  <g font-family="MiSans, Noto Sans CJK SC" text-anchor="middle">
    <text x="1051" y="199" font-size="20" font-weight="bold" fill="#1f2937">接口 B</text>
    <text x="1051" y="229" font-size="18" fill="#334155">HTTP</text>
    <text x="1051" y="256" font-size="15" fill="#64748b">/search</text>
  </g>

  <!-- AI 生成 -->
  <rect x="1156" y="20" width="188" height="350" rx="16" fill="#fdf3e7" stroke="#f0d5ae" stroke-width="1.5"/>
  <text x="1180" y="54" font-family="MiSans, Noto Sans CJK SC" font-size="20" font-weight="bold" fill="#d97706">AI 生成</text>
  <text x="1180" y="80" font-family="MiSans, Noto Sans CJK SC" font-size="15" fill="#64748b">代码人工验收</text>
  <line x1="1126" y1="192" x2="1170" y2="128" stroke="#7a8aa0" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="1126" y1="238" x2="1170" y2="288" stroke="#7a8aa0" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="1179" y="88" width="148" height="70" rx="12" fill="#23373b" opacity="0.06"/>
  <rect x="1176" y="84" width="148" height="70" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="1250" y="128" font-family="MiSans, Noto Sans CJK SC" font-size="17" text-anchor="middle" fill="#1f2937">UI 演示界面</text>
  <rect x="1179" y="254" width="148" height="70" rx="12" fill="#23373b" opacity="0.06"/>
  <rect x="1176" y="250" width="148" height="70" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="1250" y="294" font-family="MiSans, Noto Sans CJK SC" font-size="17" text-anchor="middle" fill="#1f2937">评测器</text>
</svg>
