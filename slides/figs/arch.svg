<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8aa0"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 区域色带 -->
  <rect x="8" y="16" width="984" height="174" rx="16" fill="#f3f7fd" stroke="#c7d8f7" stroke-width="1.5"/>
  <text x="32" y="52" font-family="MiSans, Noto Sans CJK SC" font-size="22" font-weight="bold" fill="#2563eb">离线 · 只建一次</text>
  <rect x="8" y="224" width="984" height="174" rx="16" fill="#f0faf9" stroke="#bfe6e0" stroke-width="1.5"/>
  <text x="32" y="260" font-family="MiSans, Noto Sans CJK SC" font-size="22" font-weight="bold" fill="#0d9488">在线 · 每次查询</text>

  <!-- 离线流程 -->
  <g font-family="MiSans, Noto Sans CJK SC" text-anchor="middle">
    <rect x="33" y="76" width="180" height="92" rx="12" fill="#23373b" opacity="0.06"/>
    <rect x="30" y="72" width="180" height="92" rx="12" fill="#e8eefc" stroke="#2563eb" stroke-width="2"/>
    <text x="120" y="114" font-size="28" fill="#1f2937">语料库</text>
    <text x="120" y="146" font-size="18" fill="#64748b">100,001 篇文档</text>

    <rect x="286" y="76" width="180" height="92" rx="12" fill="#23373b" opacity="0.06"/>
    <rect x="283" y="72" width="180" height="92" rx="12" fill="#e8eefc" stroke="#2563eb" stroke-width="2"/>
    <text x="373" y="114" font-size="28" fill="#1f2937">输入预处理</text>
    <text x="373" y="146" font-size="18" fill="#64748b">分词 · 归一化</text>

    <rect x="540" y="76" width="180" height="92" rx="12" fill="#23373b" opacity="0.06"/>
    <rect x="537" y="72" width="180" height="92" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="2"/>
    <text x="627" y="114" font-size="28" fill="#1f2937">倒排索引</text>
    <text x="627" y="146" font-size="18" fill="#64748b">词 → 文档 + 位置</text>
  </g>

  <line x1="214" y1="118" x2="278" y2="118" stroke="#7a8aa0" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="467" y1="118" x2="531" y2="118" stroke="#7a8aa0" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 离线产物清单 -->
  <g font-family="MiSans, Noto Sans CJK SC" fill="#64748b">
    <text x="750" y="104" font-size="17" font-weight="bold" fill="#475569">索引目录</text>
    <text x="750" y="128" font-size="13">manifest.json</text>
    <text x="750" y="146" font-size="13">docs.jsonl · postings.jsonl</text>
    <text x="750" y="164" font-size="13">offsets.jsonl · stats.json</text>
  </g>

  <!-- 在线流程 -->
  <g font-family="MiSans, Noto Sans CJK SC" text-anchor="middle">
    <rect x="33" y="284" width="180" height="92" rx="12" fill="#23373b" opacity="0.06"/>
    <rect x="30" y="280" width="180" height="92" rx="12" fill="#e0f2f0" stroke="#0d9488" stroke-width="2"/>
    <text x="120" y="336" font-size="28" fill="#1f2937">用户查询</text>

    <rect x="286" y="284" width="180" height="92" rx="12" fill="#23373b" opacity="0.06"/>
    <rect x="283" y="280" width="180" height="92" rx="12" fill="#e0f2f0" stroke="#0d9488" stroke-width="2"/>
    <text x="373" y="322" font-size="28" fill="#1f2937">理解查询</text>
    <text x="373" y="354" font-size="18" fill="#64748b">同样先分词</text>

    <rect x="540" y="284" width="180" height="92" rx="12" fill="#23373b" opacity="0.06"/>
    <rect x="537" y="280" width="180" height="92" rx="12" fill="#e0f2f0" stroke="#0d9488" stroke-width="2"/>
    <text x="627" y="322" font-size="28" fill="#1f2937">匹配与打分</text>
    <text x="627" y="354" font-size="18" fill="#64748b">查表 + BM25</text>

    <rect x="793" y="284" width="180" height="92" rx="12" fill="#23373b" opacity="0.06"/>
    <rect x="790" y="280" width="180" height="92" rx="12" fill="#e0f2f0" stroke="#0d9488" stroke-width="2"/>
    <text x="880" y="322" font-size="28" fill="#1f2937">返回结果</text>
    <text x="880" y="354" font-size="18" fill="#64748b">最相关的 K 篇</text>
  </g>

  <line x1="214" y1="326" x2="278" y2="326" stroke="#7a8aa0" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="467" y1="326" x2="531" y2="326" stroke="#7a8aa0" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="721" y1="326" x2="785" y2="326" stroke="#7a8aa0" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 接缝：索引文件 -->
  <line x1="627" y1="168" x2="627" y2="272" stroke="#d97706" stroke-width="3" marker-end="url(#arrO)"/>
  <text x="645" y="212" font-family="MiSans, Noto Sans CJK SC" font-size="18" font-weight="bold" fill="#d97706">索引文件 · 接口 A</text>
</svg>
