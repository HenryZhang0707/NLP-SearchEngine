<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="300" viewBox="0 0 1240 300">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8aa0"/>
    </marker>
  </defs>

  <line x1="110" y1="100" x2="1152" y2="100" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>

  <g font-family="MiSans, Noto Sans CJK SC" text-anchor="middle">
    <!-- E0 -->
    <circle cx="160" cy="100" r="42" fill="#eef1f5" stroke="#64748b" stroke-width="2.5"/>
    <text x="160" y="109" font-size="21" font-weight="bold" fill="#1f2937">E0</text>
    <text x="160" y="176" font-size="19" font-weight="bold" fill="#1f2937">契约冻结</text>
    <text x="160" y="208" font-size="15" fill="#64748b">分词 / ID / 编码器</text>
    <text x="160" y="232" font-size="15" fill="#64748b">契约与假数据联调</text>

    <!-- E1 -->
    <circle cx="480" cy="100" r="46" fill="#fdf3e7" stroke="#d97706" stroke-width="3.5"/>
    <text x="480" y="109" font-size="21" font-weight="bold" fill="#d97706">E1 ★</text>
    <text x="480" y="176" font-size="19" font-weight="bold" fill="#d97706">端到端闭环</text>
    <text x="480" y="208" font-size="15" fill="#64748b">双索引 → HTTP 查询</text>
    <text x="480" y="232" font-size="15" fill="#64748b">词法 / 融合链路通过</text>

    <!-- E2 -->
    <circle cx="800" cy="100" r="42" fill="#f0faf9" stroke="#0d9488" stroke-width="2.5"/>
    <text x="800" y="109" font-size="21" font-weight="bold" fill="#1f2937">E2</text>
    <text x="800" y="176" font-size="19" font-weight="bold" fill="#1f2937">基线冻结</text>
    <text x="800" y="208" font-size="15" fill="#64748b">词法 / 向量 / 固定混合</text>
    <text x="800" y="232" font-size="15" fill="#64748b">基线核对并冻结</text>

    <!-- E3 -->
    <circle cx="1120" cy="100" r="42" fill="#f3f7fd" stroke="#2563eb" stroke-width="2.5"/>
    <text x="1120" y="109" font-size="21" font-weight="bold" fill="#1f2937">E3</text>
    <text x="1120" y="176" font-size="19" font-weight="bold" fill="#1f2937">交付</text>
    <text x="1120" y="208" font-size="15" fill="#64748b">路由 · SLM 消融 · 演示</text>
